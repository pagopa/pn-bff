info:
  version: v1.0
components:
  parameters:
    BffCheckTPPRetrievalId:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-emd-integration/e1948f9c10848acb9c5f00edf688a5da6ed31fd0/docs/openapi/api-private.yaml#/components/parameters/retrievalId'

  schemas:
    BffNotificationsResponse:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/schemas-pn-notification.yaml#/components/schemas/NotificationSearchResponse'

    BffFullNotificationV1:
      description: >-
        Dettaglio notifica con elementi per il Frontend
      allOf:
        - $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/schemas-pn-notification.yaml#/components/schemas/SentNotificationV25'
        - type: object
          required:
            - notificationStatusHistory
            - notificationStatus
            - timeline
          properties:
            notificationStatusHistory:
              type: array
              items:
                $ref: '#/components/schemas/BffNotificationStatusHistory'
            notificationStatus:
              $ref: '#/components/schemas/BffNotificationStatus'
            timeline:
              type: array
              x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
              items:
                $ref: '#/components/schemas/BffNotificationDetailTimeline'
            radd:
              $ref: '#/components/schemas/BffNotificationDetailTimeline'
            otherDocuments:
              type: array
              items:
                $ref: '#/components/schemas/BffNotificationDetailDocument'
            notificationCostDetails:
              $ref: '#/components/schemas/BffNotificationCostDetails'

    BffNotificationStatusHistory:
      type: object
      additionalProperties: false
      required:
        - status
        - activeFrom
        - relatedTimelineElements
      properties:
        status:
          $ref: '#/components/schemas/BffNotificationStatus'
        activeFrom:
          type: string
          format: date-time
        relatedTimelineElements:
          type: array
          items:
            type: string
        steps:
          type: array
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
          items:
            $ref: '#/components/schemas/BffNotificationDetailTimeline'
        recipient:
          type: string
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
        deliveryMode:
          $ref: '#/components/schemas/BffNotificationDeliveryMode'
        reworkedStatus:
          $ref: '#/components/schemas/BffNotificationReworkedStatus'

    BffNotificationStatus:
      type: string
      enum:
        - IN_VALIDATION
        - ACCEPTED
        - DELIVERING
        - DELIVERED
        - VIEWED
        - EFFECTIVE_DATE
        - PAID
        - UNREACHABLE
        - CANCELLED
        - REFUSED
        - CANCELLATION_IN_PROGRESS
        - RETURNED_TO_SENDER
        - NOTIFICATION_TIMELINE_REWORKED

    BffNotificationReworkedStatus:
      type: string
      enum:
        - VALID
        - NOT_VALID

    BffNotificationDeliveryMode:
      type: string
      enum:
        - analog
        - digital
    BffNotificationDetailDocument:
      description: >-
        Documento della notifica.
      allOf:
        - $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/schemas-pn-notification.yaml#/components/schemas/NotificationMetadataAttachment'
        - type: object
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 512
              pattern: ^.*$
            requiresAck:
              type: string
            docIdx:
              type: string
              maxLength: 3
              pattern: ^\d+$
            documentId:
              type: string
            documentType:
              type: string
            recIndex:
              type: integer
            recipient:
              $ref: '#/components/schemas/BffDocumentRecipientData'

    BffDocumentRecipientData:
      type: object
      required:
        - denomination
        - taxId
      properties:
        denomination:
          type: string
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
        taxId:
          type: string
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL

    BffLegalFactId:
      type: object
      required:
        - key
        - category
      properties:
        key:
          type: string
          pattern: ^(safestorage:\/\/)?[A-Za-z0-9._-]+$
          maxLength: 512
        category:
          $ref: "#/components/schemas/BffLegalFactType"

    BffLegalFactType:
      type: string
      enum:
        - AAR
        - SENDER_ACK
        - DIGITAL_DELIVERY
        - ANALOG_DELIVERY
        - RECIPIENT_ACCESS
        - PEC_RECEIPT
        - ANALOG_FAILURE_DELIVERY
        - NOTIFICATION_CANCELLED

    BffNotificationDetailTimeline:
      type: object
      required:
        - elementId
        - timestamp
        - category
        - details
      additionalProperties: false
      properties:
        elementId:
          type: string
        timestamp:
          type: string
          format: date-time
        legalFactsIds:
          type: array
          items:
            $ref: "#/components/schemas/BffLegalFactId"
        category:
          $ref: "#/components/schemas/BffTimelineCategory"
        details:
          $ref: "#/components/schemas/BffNotificationDetailTimelineDetails"
        hidden:
          type: boolean
        index:
          type: integer
        reworkedStatus:
          $ref: '#/components/schemas/BffNotificationReworkedStatus'

    BffTimelineCategory:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery-push/bbd709ad178a5c5fab4e5ab71d6a71f43e4df9e6/docs/openapi/schemas-pn-timeline-external.yaml#/components/schemas/TimelineElementCategoryV28'

    BffNotificationDetailTimelineDetails:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery-push/bbd709ad178a5c5fab4e5ab71d6a71f43e4df9e6/docs/openapi/schemas-pn-timeline-external.yaml#/components/schemas/TimelineElementDetailsV28'
    
    BffRequestStatus:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery-push/bbd709ad178a5c5fab4e5ab71d6a71f43e4df9e6/docs/openapi/api-internal-pn-delivery-push.yaml#/components/schemas/RequestStatus'
    
    BffCheckAarRequest:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/api-internal-web-recipient.yaml#/components/schemas/RequestCheckAarMandateDto'
    
    BffCheckAarResponse:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/api-internal-web-recipient.yaml#/components/schemas/ResponseCheckAarMandateDto'

    BffNewNotificationRequest:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/schemas-pn-notification.yaml#/components/schemas/NewNotificationRequestV25'

    BffNewNotificationResponse:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/api-internal-b2b-pa.yaml#/components/schemas/NewNotificationResponse'

    BffPreLoadRequest:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/api-internal-b2b-pa.yaml#/components/schemas/PreLoadRequest'

    BffPreLoadResponse:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/dc615aec04c88e33f6024df8203ed2dcc3c44770/docs/openapi/api-internal-b2b-pa.yaml#/components/schemas/PreLoadResponse'

    BffCheckTPPResponse:
      $ref: 'https://raw.githubusercontent.com/pagopa/pn-emd-integration/e1948f9c10848acb9c5f00edf688a5da6ed31fd0/docs/openapi/api-private.yaml#/components/schemas/RetrievalPayload'

    BffNotificationCostDetails:
      type: object
      description: >-
        Cost details of a notification. Cost-related fields are present only when the status is OK
      required:
        - status
      properties:
        status:
          description: Status of the response from the notification-cost-service microservice
          type: string
          enum:
            - OK
            - UNAVAILABLE
            - ERROR
          default: UNAVAILABLE
        totalCost:
          description: Total cost of the notification in euro cents, including VAT
          type: integer
          format: int32
        baseCost:
          description: Base notification cost in euro cents
          type: integer
          format: int32
        analogCost:
          description: Total cost of analog flows in euro cents, including VAT
          type: integer
          format: int32
        numberOfAnalogCost:
          description: Total number of paper deliveries (both simple registered mail and 890/AR…)
          type: integer
          format: int32