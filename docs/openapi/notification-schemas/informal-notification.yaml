info:
  title: Schemas OpenApi per le comunicazioni bonarie
  version: v1.0
components:
  schemas:
    BffCampaignSearchResponseV1:
      $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/api-internal-web-campaign.yaml#/components/schemas/CampaignSearchResponse"

    BffCampaignDetailResponseV1:
      type: object
      required:
        - campaignId
        - title
        - description
        - startDate
        - campaignStatus
        - serviceName
        - channels
      properties:
        campaignId:
          type: string
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        campaignStatus:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/api-internal-web-campaign.yaml#/components/schemas/CampaignStatus"
        serviceName:
          type: string
        channels:
          type: array
          items:
            $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/api-internal-web-campaign.yaml#/components/schemas/ChannelType"

    BffFullInformalNotificationV1:
      description: Dettaglio notifica bonaria esposto al frontend del destinatario.
      type: object
      required:
        - iun
        - senderDenomination
        - campaignId
        - subject
        - recipients
        - notificationStatus
        - sentAt
      properties:
        iun:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/IUN"
        senderDenomination:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/Denomination"
        campaignId:
          type: string
        additionalLanguages:
          type: array
          maxItems: 1
          items:
            type: string
        subject:
          type: string
          maxLength: 134
          pattern: ^.*$
        recipients:
          type: array
          items:
            $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/FullInformalNotificationRecipientV1"
        documents:
          type: array
          items:
            $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/NotificationDocument"
        group:
          type: string
          pattern: ^[ -~]*$
          maxLength: 1024
        notificationStatus:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/remote-refs.yaml#/components/schemas/InformalNotificationStatusV1"
        sentAt:
          type: string
          format: date-time
        senderPaId:
          type: string
          pattern: ^.*$
          maxLength: 256
        documentsAvailable:
          type: boolean
        filedAt:
          type: string
          format: date-time
          description: Data di accettazione della notifica/comunicazione
        senderContacts:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/api-internal-web-informal-recipient.yaml#/components/schemas/SenderContactInfo"
        timeline:
          type: array
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
          items:
            $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/remote-refs.yaml#/components/schemas/InformalTimelineElementV1"

    BffInformalSenderNotificationSearchResponse:
      title: List of sender's informal notifications
      type: object
      properties:
        resultsPage:
          type: array
          items:
            $ref: '#/components/schemas/BffInformalSenderNotificationSearchRow'
        moreResult:
          type: boolean
        nextPagesKey:
          type: array
          items:
            type: string

    BffInformalSenderNotificationSearchRow:
      type: object
      properties:
        iun:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/UnifiedIUN"
        recipients:
          type: array
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
          items:
            type: string
            format: password # NO EXTERNAL
        notificationStatus:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/remote-refs.yaml#/components/schemas/InformalNotificationStatusV1"
        communicationOutcomes:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/CommunicationOutcomes"

    BffFullSentInformalNotificationV1:
      description: Dettaglio notifica bonaria esposto al frontend del mittente.
      type: object
      required:
        - iun
        - senderDenomination
        - recipients
        - subject
        - notificationStatus
      properties:
        iun:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/InformalIUN"
        senderDenomination:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/Denomination"
        recipients:
          type: array
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
          items:
            $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/FullInformalNotificationRecipientV1"
        subject:
          type: string
        documents:
          type: array
          items:
            $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/NotificationDocument"
        notificationStatus:
          $ref: "https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/remote-refs.yaml#/components/schemas/InformalNotificationStatusV1"
        documentsAvailable:
          type: boolean
        channelsStatus:
          type: array
          items:
            $ref: '#/components/schemas/BffChannelDeliveryStatusV1'

    BffNotificationChannelType:
      type: string
      enum:
        - IO
        - EMAIL
        - SMS
        - PEC
        - ANALOG
        - SEND

    BffChannelStatusV1:
      type: string
      enum:
        - READY_TO_SEND
        - WAITING_TO_SEND
        - SENT
        - DELIVERED
        - VIEWED
        - UNAVAILABLE
        - NOT_DELIVERED
        - WORKFLOW_ENDED
        - FILED

    BffChannelDeliveryStatusV1:
      type: object
      required:
        - channel
        - status
      properties:
        channel:
          $ref: '#/components/schemas/BffNotificationChannelType'
        status:
          $ref: '#/components/schemas/BffChannelStatusV1'