info:
  version: v1.0
components:
  schemas:
    BffNotificationTimelineResponse:
      type: object
      required:
        - iun
        - subject
        - recipients
        - notificationStatusHistory
      properties:
        iun:
          type: string
        subject:
          type: string
        recipients:
          type: array
          items:
            $ref: 'https://raw.githubusercontent.com/pagopa/pn-delivery/e1b2b8fd1c6c928596f3ead13a34399e1b84d66e/docs/openapi/schemas-pn-notification.yaml#/components/schemas/NotificationRecipientV24'
        notificationStatusHistory:
          type: array
          items:
            $ref: '#/components/schemas/BffNotificationTimelineStatusHistory'

    BffNotificationTimelineStatusHistory:
      type: object
      required:
        - status
        - activeFrom
        - steps
      properties:
        status:
          $ref: './notification.yaml#/components/schemas/BffNotificationStatus'
        activeFrom:
          type: string
          format: date-time
        viewedByMandate:
          type: string
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
        deliveryMode:
          $ref: './notification.yaml#/components/schemas/BffNotificationDeliveryMode'
        reworkedStatus:
          $ref: './notification.yaml#/components/schemas/BffNotificationReworkedStatus'
        steps:
          type: array
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
          items:
            $ref: '#/components/schemas/BffNotificationTimelineStep'

    BffNotificationTimelineStep:
      description: >-
        Elemento della nuova timeline. Può rappresentare un singolo evento
        oppure un gruppo di eventi appartenenti allo stesso invio.
      type: object
      required:
        - stepType
      properties:
        stepType:
          $ref: '#/components/schemas/BffNotificationTimelineStepType'
        event:
          description: Valorizzato quando stepType è EVENT
          allOf:
            - $ref: '#/components/schemas/BffNotificationTimelineEvent'
        group:
          description: Valorizzato quando stepType è GROUP
          allOf:
            - $ref: '#/components/schemas/BffNotificationTimelineGroup'

    BffNotificationTimelineStepType:
      description: >-
        Discriminante che indica se lo step rappresenta un evento singolo
        oppure un gruppo di eventi.
      type: string
      enum:
        - EVENT
        - GROUP

    BffNotificationTimelineEvent:
      description: Evento singolo della timeline esposto al frontend
      type: object
      required:
        - elementId
        - timestamp
        - category
        - details
        - isHidden
      properties:
        elementId:
          type: string
          description: Identificativo univoco dell'evento nella timeline
          maxLength: 512
        timestamp:
          type: string
          format: date-time
          description: Data e ora dell'evento
        details:
          allOf:
            - $ref: './notification.yaml#/components/schemas/BffNotificationDetailTimelineDetails'
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
        legalFactsIds:
          type: array
          description: Attestazioni opponibili a terzi associate all'evento
          items:
            $ref: './notification.yaml#/components/schemas/BffLegalFactId'
        category:
          $ref: './notification.yaml#/components/schemas/BffTimelineCategory'
        isHidden:
          type: boolean
          description: >-
            Indica che il contenuto dell'evento non deve essere mostrato.
            Un evento nascosto viene comunque restituito quando contiene
            almeno un legal fact
        reworkedStatus:
          $ref: './notification.yaml#/components/schemas/BffNotificationReworkedStatus'

    BffNotificationTimelineGroup:
      description: >-
        Gruppo di eventi relativi allo stesso destinatario, canale e tentativo
        di invio
      type: object
      required:
        - recIndex
        - category
        - groupId
        - hasReworkedEvents
        - events
      properties:
        denomination:
          type: string
          description: Denominazione del destinatario
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
        taxId:
          type: string
          description: Codice fiscale del destinatario
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
        recIndex:
          type: integer
          format: int32
          minimum: 0
          description: Indice del destinatario nella notifica
        category:
          $ref: '#/components/schemas/BffNotificationTimelineGroupCategory'
        channel:
          $ref: '#/components/schemas/BffNotificationTimelineGroupChannel'
        attempt:
          type: integer
          format: int32
          minimum: 1
          description: Numero del tentativo di invio, espresso a partire da 1
        registeredLetterCode:
          type: string
          maxLength: 128
          description: Codice della raccomandata più recente associata al gruppo
        groupId:
          type: string
          maxLength: 512
          description: Identificativo del gruppo
        hasReworkedEvents:
          type: boolean
          description: >-
            Indica che almeno un evento appartenente al gruppo è stato coinvolto
            in un rework e presenta reworkedStatus valorizzato
        events:
          type: array
          minItems: 1
          description: Eventi che appartengono al gruppo
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
          items:
            $ref: '#/components/schemas/BffNotificationTimelineEvent'

    BffNotificationTimelineGroupCategory:
      description: Tipologia del flusso di invio aggregato
      type: string
      enum:
        - COURTESY
        - DIGITAL
        - ANALOG
        - ANALOG_FAILURE

    BffNotificationTimelineGroupChannel:
      description: The channel of the group
      type: string
      enum:
        - AR_REGISTERED_LETTER
        - REGISTERED_LETTER_890
        - SIMPLE_REGISTERED_LETTER
        - PEC
        - SERCQ
        - COURTESY